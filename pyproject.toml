[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "esann-feature-block-search"
version = "0.1.0"
description = "Replication package for feature-conditioned quantum block search"
requires-python = ">=3.11"
dependencies = ["numpy>=1.23", "scipy>=1.12", "scikit-learn>=1.6"]
[tool.setuptools.packages.find]
where = ["src"]
